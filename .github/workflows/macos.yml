name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project Paste.xcodeproj -scheme Paste \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="Paste/PasteDistribution.entitlements" \
            build

      - name: Test
        run: |
          xcodebuild -project Paste.xcodeproj -scheme Paste \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Verify signature
        run: |
          APP="build/DerivedData/Build/Products/Release/Copydock.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/Copydock"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Package dmg
        run: |
          APP="build/DerivedData/Build/Products/Release/Copydock.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          STAGING="build/dmg-staging"
          mkdir -p dist
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/Copydock.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Copydock -srcfolder "$STAGING" -ov -format UDZO "dist/Copydock-${VERSION}-macos.dmg"
          shasum -a 256 "dist/Copydock-${VERSION}-macos.dmg" > "dist/Copydock-${VERSION}-macos.dmg.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copydock-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          body: |
            Unsigned/ad-hoc build. After downloading, either right-click → Open,
            or clear quarantine: `xattr -dr com.apple.quarantine /Applications/Copydock.app`
